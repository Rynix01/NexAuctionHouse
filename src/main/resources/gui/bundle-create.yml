item-lore:
  selected:
    - ""
    - "<green>✔ Added to bundle"
    - "<yellow>Click to remove from bundle."
  available:
    - ""
    - "<gray>Click to add to bundle."
  full:
    - ""
    - "<red>Bundle is full! ({max} items max)"

buttons:
  confirm:
    slot: 48
    material: LIME_STAINED_GLASS_PANE
    name: "<green>Create Bundle"
    lore:
      - "<gray>Items: <yellow>{selected}/{max}"
      - "<gray>Bundle Price: <yellow>{price}"
      - ""
      - "<yellow>Click to list this bundle."
  info:
    slot: 49
    material: CHEST
    name: "<gold>Bundle Info"
    lore:
      - "<gray>Select items above to bundle them."
      - "<gray>All selected items are sold together."
      - ""
      - "<gray>Selected: <yellow>{selected}/{max}"
      - "<gray>Minimum items: <yellow>{min}"
  cancel:
    slot: 50
    material: RED_STAINED_GLASS_PANE
    name: "<red>Cancel"
    lore:
      - "<gray>Return without creating a bundle."

filler:
  enabled: true
  use-theme: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "
